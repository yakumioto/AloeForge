[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "aloeforge-bootstrap"
version = "0.1.0.dev0"
description = "CPU-only AloeForge reference and worker package skeletons"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
reference = ["numpy==2.3.3"]
worker = ["numpy==2.3.3"]
dev = ["pytest==8.4.2", "ruff==0.14.0", "numpy==2.3.3"]

[tool.hatch.build.targets.wheel]
packages = ["src/aloeforge_reference", "src/aloeforge_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
